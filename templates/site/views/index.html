{% extends 'base.html' %}
{% block conteudo %}

<div class="container my-5">

    <div class="row">
        <div class="col-lg-8">
            <div class="row">
                {% for post in posts %}
                <div class="col-md-6">
                    <div class="card mb-4">
                        <div class="card-body">
                            <a href="{{url('post/'~post.id)}}" class="text-decoration-none text-black">
                                <h5 class="card-title">{{post.titulo}}</h5>
                                <p class="card-text">{{resumirTexto(post.texto, 150)}}</p>
                            </a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="col-lg-4">
            {% include'sidebar.html' %}
        </div>
    </div>

</div>

{% endblock %}
